name: Empreintes recherche par image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/embed.mjs', '.github/workflows/imgsearch.yml', 'imgsearch/REBUILD']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save @huggingface/transformers@3.0.2
      - run: node tools/embed.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add imgsearch/emb.bin imgsearch/ids.json models
          git commit -m "Empreintes recherche par image" || echo rien
          git pull --rebase origin main
          git push origin HEAD:main
